[tools]
typst = "0.15.0"
typstyle = "0.15.0"

[env]
TYPST_ROOT = "{{config_root}}"
TYPST_FONT_PATHS = "{{config_root}}/thesis/fonts"

[tasks."fmt:typst"]
description = "Format the typst code"
run = ["typstyle -i ./ --timing"]

[tasks."export-thesis"]
description = "Export the document to PDF"
run = [
    "typst compile thesis/main.typ --format pdf --pdf-standard a-3u 'Tim Peko BSc Bioinformatics Thesis - Makroevolution in multi-agent cellular automata.pdf'"
]
