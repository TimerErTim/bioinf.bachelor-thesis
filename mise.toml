[tools]
typst = "0.15"
typstyle = "0.15"
"cargo:hayagriva" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[env]
TYPST_ROOT = "{{config_root}}"
TYPST_FONT_PATHS = "{{config_root}}/thesis/fonts"

[vars]
THESIS_TITLE = "A population-based multi-agent approach for simulating large-scale system dynamics in discrete environments"

[tasks.test]
description = "Run the Rust test suite with cargo-nextest"
run = ["cargo nextest run --workspace"]

[tasks."fmt:typst"]
description = "Format the typst code"
run = ["typstyle -i ./ --timing"]

[tasks."export:thesis"]
description = "Export the document to PDF"
env = { THESIS_TITLE = "{{ vars.THESIS_TITLE }}" }
run = [
    'typst compile thesis/main.typ --format pdf --input "title=$THESIS_TITLE" --pdf-standard a-3u "Tim Peko BSc Bioinformatics Thesis - {{ env.THESIS_TITLE }}.pdf"',
    'typst compile thesis/main.typ --format pdf --input "title=$THESIS_TITLE" --pdf-standard a-3u --input "printing=true" "Tim Peko BSc Bioinformatics Thesis Print - {{ env.THESIS_TITLE }}.pdf"'
]

[tasks."export:midterm-presentation"]
description = "Export the midterm presentation to PDF"
dir = "presentations"
env = { THESIS_TITLE = "{{ vars.THESIS_TITLE }}" }
run = [
    'typst compile --format pdf midterm.typ midterm_slides.pdf --input x-handout=false --input "title=$THESIS_TITLE"',
    'typst compile --format pdf midterm.typ midterm_handout.pdf --input x-handout=true --input "title=$THESIS_TITLE"'
]
